<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayda ID Collection Kiosk | Adama Main Post Office</title>
  <meta name="description" content="Official public self-service kiosk for Fayda National ID collection tracking and automated counter desk dispatch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Public Kiosk Header (Strictly Citizen-Facing) -->
  <header class="main-header">
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-emblem" aria-hidden="true">🇪🇹</div>
        <div class="brand-titles">
          <h1>
            Fayda National ID Dispatch
            <span class="badge-fayda">Public Kiosk</span>
          </h1>
          <p>Adama Main Post Office • Citizen Self-Service Terminal</p>
        </div>
      </div>
      <div class="nav-links">
        <span class="kiosk-status-badge">
          <span class="pulse-dot"></span> Lobby Kiosk #01 • Online
        </span>
      </div>
    </div>
  </header>

  <main class="kiosk-container">
    <!-- Citizen Query Card -->
    <section class="search-card" aria-labelledby="kioskTitle">
      <div class="kiosk-heading">
        <h2 id="kioskTitle">National ID Collection & Desk Dispatch</h2>
        <p>Enter your 16-digit Fayda ID or registered mobile phone number to find your collection counter</p>
      </div>

      <form id="trackForm" class="search-form" onsubmit="return false;">
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="kiosk-input"
            placeholder="e.g. FAN-1029-8472-9901 or +251911223344"
            required
            autocomplete="off"
            autofocus
            aria-label="Fayda ID or Phone Number"
          >
        </div>

        <!-- Priority Accessibility Checkbox -->
        <label class="priority-toggle-box" for="priorityCheckbox">
          <input type="checkbox" id="priorityCheckbox" class="priority-checkbox">
          <div class="priority-label">
            <span class="priority-title">♿ Request Priority Desk Access</span>
            <span class="priority-subtext">For expectant mothers, senior citizens, and persons with reduced mobility</span>
          </div>
        </label>

        <button type="submit" id="trackBtn" class="btn-primary-action">
          <span>Check Status & Get Counter Desk</span>
          <span aria-hidden="true">➔</span>
        </button>
      </form>

      <!-- Categorized Quick Testing Sample Pills -->
      <div class="sample-bar">
        <div class="sample-bar-title">
          <span>⚡ Demo Quick-Fill Scenarios:</span>
        </div>
        <div class="sample-pills" id="samplePills">
          <!-- Shelf A -> Desk 2 -->
          <button type="button" class="sample-btn" data-id="FAN-1029-8472-9901" data-prio="false" title="Age 28, Shelf A / Box 04 -> Desk 2">
            <span>Abebe (Shelf A)</span>
            <span class="pill-tag">Desk 2</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-2045-6612-8833" data-prio="false" title="Age 24, Shelf A / Box 01 -> Desk 2">
            <span>Meron (Shelf A)</span>
            <span class="pill-tag">Desk 2</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-8831-2904-7719" data-prio="false" title="Age 37, Shelf A / Box 15 -> Desk 2">
            <span>Henok (Shelf A)</span>
            <span class="pill-tag">Desk 2</span>
          </button>

          <!-- Shelf B -> Desk 3 -->
          <button type="button" class="sample-btn" data-id="FAN-3849-5721-6623" data-prio="false" title="Age 33, Shelf B / Box 12 -> Desk 3">
            <span>Selamawit (Shelf B)</span>
            <span class="pill-tag">Desk 3</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-4920-1845-7761" data-prio="false" title="Age 29, Shelf B / Box 05 -> Desk 3">
            <span>Binyam (Shelf B)</span>
            <span class="pill-tag">Desk 3</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-7201-3849-1122" data-prio="false" title="Age 52, Shelf B / Box 18 -> Desk 3">
            <span>Robel (Shelf B)</span>
            <span class="pill-tag">Desk 3</span>
          </button>

          <!-- Senior Citizens (Age 60+) -> Desk 1 Priority -->
          <button type="button" class="sample-btn" data-id="FAN-7734-1920-4411" data-prio="false" title="Age 68 (Senior) -> Desk 1 Priority">
            <span>Wro. Aster (Age 68)</span>
            <span class="pill-tag" style="background:#fef3c7; color:#92400e; border:1px solid #f59e0b;">Senior Desk 1</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-8491-0023-7744" data-prio="false" title="Age 74 (Senior) -> Desk 1 Priority">
            <span>Ato Berhanu (Age 74)</span>
            <span class="pill-tag" style="background:#fef3c7; color:#92400e; border:1px solid #f59e0b;">Senior Desk 1</span>
          </button>

          <!-- In Transit (Dispatched from Central Hub) -->
          <button type="button" class="sample-btn" data-id="FAN-9921-6634-1188" data-prio="false" title="Batch #409 -> In Transit Notice">
            <span>Dawit</span>
            <span class="pill-tag" style="background:#fffbeb; color:#92400e; border:1px solid #f59e0b;">In Transit</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-5109-8832-7711" data-prio="false" title="Batch #412 -> In Transit Notice">
            <span>Eden</span>
            <span class="pill-tag" style="background:#fffbeb; color:#92400e; border:1px solid #f59e0b;">In Transit</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-4481-9023-5599" data-prio="false" title="Batch #501 -> In Transit Notice">
            <span>Kalkidan</span>
            <span class="pill-tag" style="background:#fffbeb; color:#92400e; border:1px solid #f59e0b;">In Transit</span>
          </button>

          <!-- Already Collected -->
          <button type="button" class="sample-btn" data-id="FAN-5512-8839-2244" data-prio="false" title="Issued at Desk 3 -> Collected Notice">
            <span>Tigist</span>
            <span class="pill-tag" style="background:#f1f5f9; color:#475569; border:1px solid #94a3b8;">Collected</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-6689-1024-3388" data-prio="false" title="Issued at Desk 2 -> Collected Notice">
            <span>Mulugeta</span>
            <span class="pill-tag" style="background:#f1f5f9; color:#475569; border:1px solid #94a3b8;">Collected</span>
          </button>
          <button type="button" class="sample-btn" data-id="FAN-7901-4432-8855" data-prio="false" title="Issued at Desk 1 -> Collected Notice">
            <span>Wro. Gennet</span>
            <span class="pill-tag" style="background:#f1f5f9; color:#475569; border:1px solid #94a3b8;">Collected</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Dynamic Tracking & Desk Dispatch Result Section -->
    <section id="resultsSection" class="results-area" aria-live="polite">
      <!-- Dynamically filled via js/citizen.js -->
    </section>
  </main>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <script src="js/citizen.js"></script>
</body>
</html>
